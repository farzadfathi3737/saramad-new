name: Deploy

on:
  push:
    branches:
      - '**'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    if: |
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, 'action: qa')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_EXTERNAL_API=${{ secrets.NEXT_PUBLIC_EXTERNAL_API }} \
            -t saramad-new:latest \
            -f dockerfile \
            .

      - name: Export image as tar
        run: docker save saramad-new:latest | gzip > saramad-new.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: saramad-new.tar.gz
          target: /opt/saramad-new/

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.yml
          target: /opt/saramad-new/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/saramad-new

            echo "Loading Docker image..."
            docker load < saramad-new.tar.gz

            echo "Stopping old container..."
            docker compose down || true

            echo "Starting new container..."
            NEXT_PUBLIC_EXTERNAL_API=${{ secrets.NEXT_PUBLIC_EXTERNAL_API }} \
            docker compose up -d

            echo "Cleaning up..."
            rm -f saramad-new.tar.gz
            docker image prune -f

            echo "Deploy completed. Container status:"
            docker compose ps
